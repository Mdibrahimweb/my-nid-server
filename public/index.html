<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-emerald-500 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md text-center">

        <!-- Avatar -->
        <div class="flex justify-center mb-6">
            <div class="w-24 h-24 bg-emerald-300 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5.121 17.804A9 9 0 1118.879 17.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
        </div>

        <!-- Login Card -->
        <div class="bg-white p-8 rounded shadow-md">
            <h2 class="text-2xl font-semibold mb-6">Admin Login</h2>

            <div class="mb-4">
                <input type="text" id="username" placeholder="Username"
                    class="w-full px-4 py-3 bg-gray-100 rounded focus:outline-none focus:ring-2 focus:ring-emerald-400">
            </div>

            <div class="mb-6">
                <input type="password" id="password" placeholder="Password"
                    class="w-full px-4 py-3 bg-gray-100 rounded focus:outline-none focus:ring-2 focus:ring-emerald-400">
            </div>

            <button onclick="login()"
                class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-semibold py-3 rounded transition duration-300">
                LOGIN
            </button>

            <p class="mt-4 text-sm text-gray-600">
                Forgot Password?
                <a href="#" class="text-gray-800 underline">Click Here</a>
            </p>
        </div>
    </div>


    <script>
        async function login() {
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });

            const data = await res.json();

            if (data.success) {
                window.location.href = "dashboard.html";
            } else {
                alert("Wrong Login");
            }
        }
    </script>

</body>

</html>
